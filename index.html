<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voice Markdown Recorder</title>

  <style>
    body { font-family: sans-serif; padding: 20px; }
    .record-button { font-size: 20px; padding: 20px; }
    .preview { background: #111; color: #0f0; padding: 10px; }
  </style>
</head>

<body>
  <main class="app">
    <h1>Voice Markdown Recorder</h1>
    <p id="status">初期化中...</p>

    <button id="recordButton">
      🎤 押している間だけ録音
    </button>

    <div>
      <button id="downloadButton">Markdownを保存（ローカル）</button>
    </div>

    <h2>プレビュー</h2>
    <pre id="preview"></pre>
  </main>

<script>
document.addEventListener("DOMContentLoaded", () => {

let recognition;
let isPressing = false;
let buffer = "";

const btn = document.getElementById("recordButton");
const preview = document.getElementById("preview");
const status = document.getElementById("status");

// ======================
// SpeechRecognition
// ======================
if (!('webkitSpeechRecognition' in window)) {
  status.textContent = "❌ Chromeで開いてください";
  return;
}

recognition = new webkitSpeechRecognition();
recognition.lang = "ja-JP";
recognition.continuous = false;
recognition.interimResults = false;

recognition.onresult = (event) => {
  if (!isPressing) return;

  const text = event.results[0][0].transcript;
  buffer += text + "\n";
  preview.textContent = buffer;
};

recognition.onerror = (e) => {
  console.error(e);
  status.textContent = "❌ 音声認識エラー";
};

// ======================
// PTT
// ======================
btn.addEventListener("pointerdown", () => {
  if (isPressing) return;

  isPressing = true;
  buffer = "";
  status.textContent = "🎤 録音中...";

  try {
    recognition.start();
  } catch(e) {}
});

// 🔥 重要：ボタン外で離しても止まる
window.addEventListener("pointerup", async () => {
  if (!isPressing) return;

  isPressing = false;
  recognition.stop();
  status.textContent = "⏳ 保存中...";

  if (!buffer.trim()) {
    status.textContent = "⚠️ 空です";
    return;
  }

  const timestamp = new Date().toISOString();

  try {
    const res = await fetch("https://dreamgroove1.fuwafuwow.workers.dev/", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-api-key": "mysecret123"
      },
      body: JSON.stringify({
        content: buffer,
        tag: "voice",
        timestamp
      })
    });

    const data = await res.json();
    status.textContent = "☁ 保存完了: " + data.file;

  } catch (e) {
    console.error(e);
    status.textContent = "❌ 保存失敗";
  }
});

// ======================
// ローカル保存（任意）
// ======================
document.getElementById("downloadButton").addEventListener("click", () => {
  const blob = new Blob([preview.textContent], { type: "text/markdown" });
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "voice.md";
  a.click();

  URL.revokeObjectURL(url);
});

});
</script>

</body>
</html>
