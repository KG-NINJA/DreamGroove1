<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DreamGroove Voice Recorder</title>

<style>
body {
  font-family: sans-serif;
  text-align: center;
  background: #000;
  color: #fff;
}

#status {
  margin: 10px;
  font-size: 14px;
  opacity: 0.8;
}

/* 録音ボタン */
#recordButton {
  width: 95vw;
  height: 140px;
  font-size: 24px;
  border-radius: 30px;
  border: none;
  background: #222;
  color: white;
}

#recordButton.recording {
  background: red;
  transform: scale(0.96);
}

/* 保存ボタン */
#saveAllButton {
  width: 95vw;
  height: 60px;
  font-size: 20px;
  margin-top: 15px;
  border-radius: 20px;
  border: none;
  background: #0af;
  color: black;
}

.preview {
  margin-top: 20px;
  background: #111;
  padding: 15px;
  min-height: 120px;
  white-space: pre-wrap;
}
</style>
</head>

<body>

<h2>🎤 Voice Recorder</h2>
<p id="status">準備完了</p>

<button id="recordButton">押して話す</button>
<button id="saveAllButton">まとめて保存</button>

<pre id="preview" class="preview"></pre>

<script>
document.addEventListener("DOMContentLoaded", () => {

let recognition;
let isPressing = false;
let isSaving = false;

let finalBuffer = "";
let draftBuffer = "";
let notes = [];

const btn = document.getElementById("recordButton");
const preview = document.getElementById("preview");
const status = document.getElementById("status");

// ======================
// 音声認識
// ======================
if (!('webkitSpeechRecognition' in window)) {
  status.textContent = "非対応ブラウザ";
  return;
}

recognition = new webkitSpeechRecognition();
recognition.lang = "ja-JP";
recognition.continuous = true;
recognition.interimResults = true;

// 🔥 音声結果（冗長）
recognition.onresult = (event) => {

  draftBuffer = "";

  for (let i = event.resultIndex; i < event.results.length; i++) {
    const txt = event.results[i][0].transcript;

    if (event.results[i].isFinal) {
      finalBuffer += txt + "\n";
    } else {
      draftBuffer += txt;
    }
  }

  preview.textContent = finalBuffer + draftBuffer;
};

// 🔥 終了時処理
recognition.onend = async () => {

  if (isPressing) {
    try { recognition.start(); } catch(e) {}
    return;
  }

  await new Promise(r => setTimeout(r, 300));

  if (!finalBuffer.trim() && draftBuffer.trim()) {
    finalBuffer = draftBuffer;
  }

  if (!finalBuffer.trim()) {
    status.textContent = "⚠️ 音声取得失敗";
    return;
  }

  const md = buildMarkdown(finalBuffer);

  notes.push(md);

  finalBuffer = "";
  draftBuffer = "";

  status.textContent = `📝 ${notes.length}件保存待ち`;

  preview.textContent = notes.join("\n---\n");
};

// ======================
// 録音開始
// ======================
btn.addEventListener("touchstart", (e) => {
  e.preventDefault();

  if (isSaving) return;

  isPressing = true;

  finalBuffer = "";
  draftBuffer = "";

  btn.classList.add("recording");
  status.textContent = "🎤 録音中";

  recognition.start();

}, { passive: false });

// ======================
// 録音終了
// ======================
window.addEventListener("touchend", (e) => {

  if (!isPressing) return;

  isPressing = false;
  recognition.stop();

  btn.classList.remove("recording");
  status.textContent = "⏳ 処理中...";

});

// ======================
// まとめ保存（安定版）
// ======================
document.getElementById("saveAllButton").addEventListener("click", async () => {

  if (notes.length === 0) {
    status.textContent = "⚠️ 保存する内容なし";
    return;
  }

  if (isSaving) return;

  isSaving = true;

  status.textContent = "☁ 保存中...";

  const text = notes.join("\n\n---\n\n");

  try {
    await safeFetch(text);
    status.textContent = "☁ 保存完了";
    notes = [];
    preview.textContent = "";
  } catch (e) {
    status.textContent = "❌ 保存失敗";
  }

  isSaving = false;
});

// ======================
// 安定fetch（タイムアウト＋リトライ）
// ======================
async function safeFetch(content) {

  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 5000);

  try {
    const res = await fetch("https://dreamgroove1.fuwafuwow.workers.dev/", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-api-key": "mysecret123"
      },
      body: JSON.stringify({
        content,
        tag: "voice",
        timestamp: new Date().toISOString()
      }),
      signal: controller.signal
    });

    clearTimeout(timeout);

    if (!res.ok) throw new Error();

  } catch {
    // 🔁 リトライ
    await fetch("https://dreamgroove1.fuwafuwow.workers.dev/", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-api-key": "mysecret123"
      },
      body: JSON.stringify({
        content,
        tag: "voice",
        timestamp: new Date().toISOString()
      })
    });
  }
}

// ======================
// Markdown生成
// ======================
function buildMarkdown(text) {

  const clean = text.trim().replace(/\n{3,}/g, "\n\n");

  return `# Voice Note

## Summary
${clean.slice(0,80)}

## Content
${clean}

---`;
}

});
</script>

</body>
</html>
