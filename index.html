<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DreamGroove Voice Recorder</title>

<style>
body {
  font-family: sans-serif;
  text-align: center;
  background: black;
  color: white;
}

#recordButton {
  width: 95vw;
  height: 140px;
  font-size: 24px;
  border-radius: 30px;
  background: #222;
  color: white;
  border: none;
  margin-top: 20px;
}

#recordButton.recording {
  background: red;
  transform: scale(0.95);
}

#saveAllButton {
  width: 95vw;
  height: 60px;
  font-size: 20px;
  margin-top: 20px;
  border-radius: 20px;
  border: none;
  background: #0af;
  color: black;
}

.preview {
  background: #111;
  padding: 15px;
  margin-top: 20px;
  min-height: 120px;
  white-space: pre-wrap;
}
</style>
</head>

<body>

<h1>🎤 Voice Recorder</h1>
<p id="status">準備完了</p>

<button id="recordButton">押して話す</button>
<button id="saveAllButton">まとめて保存</button>

<pre id="preview" class="preview"></pre>

<script>
document.addEventListener("DOMContentLoaded", () => {

let recognition;
let isPressing = false;
let buffer = "";
let notes = []; // 🔥 まとめ保存用

const btn = document.getElementById("recordButton");
const preview = document.getElementById("preview");
const status = document.getElementById("status");

// ======================
// 音声認識
// ======================
if (!('webkitSpeechRecognition' in window)) {
  status.textContent = "非対応ブラウザ";
  return;
}

recognition = new webkitSpeechRecognition();
recognition.lang = "ja-JP";
recognition.continuous = false;
recognition.interimResults = true;

// 音声取得
recognition.onresult = (event) => {
  for (let i = event.resultIndex; i < event.results.length; i++) {
    if (event.results[i].isFinal) {
      buffer += event.results[i][0].transcript + "\n";
    }
  }
  preview.textContent = notes.join("\n---\n") + "\n" + buffer;
};

// 🔥 録音終了時
recognition.onend = () => {

  if (isPressing) {
    recognition.start();
    return;
  }

  if (!buffer.trim()) {
    status.textContent = "⚠️ 音声取得失敗";
    return;
  }

  // 🔥 蓄積
  notes.push(buffer);

  buffer = "";

  status.textContent = `📝 ${notes.length}件たまってます`;

  preview.textContent = notes.join("\n---\n");
};

// ======================
// 録音開始
// ======================
btn.addEventListener("touchstart", (e) => {
  e.preventDefault();

  if (isPressing) return;

  isPressing = true;
  buffer = "";
  btn.classList.add("recording");
  status.textContent = "🎤 録音中";

  recognition.start();

}, { passive: false });

// ======================
// 録音終了
// ======================
btn.addEventListener("touchend", (e) => {
  e.preventDefault();

  if (!isPressing) return;

  isPressing = false;
  recognition.stop();
  btn.classList.remove("recording");

  status.textContent = "⏳ 処理中...";

}, { passive: false });

// ======================
// まとめて保存
// ======================
document.getElementById("saveAllButton").addEventListener("click", async () => {

  if (notes.length === 0) {
    status.textContent = "⚠️ 保存する内容なし";
    return;
  }

  status.textContent = "☁ まとめて保存中...";

  const allText = notes.join("\n\n---\n\n");
  const timestamp = new Date().toISOString();

  try {
    const res = await fetch("https://dreamgroove1.fuwafuwow.workers.dev/", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-api-key": "mysecret123"
      },
      body: JSON.stringify({
        content: allText,
        tag: "voice",
        timestamp
      })
    });

    const data = await res.json();

    status.textContent = "☁ 保存完了";

    // 🔥 リセット
    notes = [];
    preview.textContent = "";

  } catch (e) {
    console.error(e);
    status.textContent = "❌ 保存失敗";
  }

});

});
</script>

</body>
</html>
