<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>DreamGroove Voice Recorder</title>
  <style>
    :root {
      --bg: #000;
      --panel: #111;
      --panel-2: #1a1a1a;
      --text: #fff;
      --muted: #bdbdbd;
      --danger: #ff3b30;
      --accent: #39a0ff;
      --ok: #32d74b;
      --radius: 24px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      padding: 16px;
      padding-bottom: calc(16px + env(safe-area-inset-bottom));
    }

    .app {
      max-width: 720px;
      margin: 0 auto;
    }

    h1 {
      margin: 8px 0 10px;
      font-size: 28px;
      line-height: 1.2;
    }

    .status {
      margin: 0 0 14px;
      min-height: 24px;
      color: var(--muted);
      font-size: 14px;
    }

    .card {
      background: var(--panel);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 14px;
    }

    #recordButton {
      display: block;
      width: 100%;
      min-height: 148px;
      border: 0;
      border-radius: 32px;
      background: var(--panel-2);
      color: var(--text);
      font-size: 26px;
      font-weight: 700;
      touch-action: none;
      user-select: none;
      transition: transform 0.12s ease, background 0.12s ease, box-shadow 0.12s ease, opacity 0.12s ease;
      box-shadow: 0 0 0 rgba(255, 59, 48, 0);
    }

    #recordButton.arming {
      background: #222;
      transform: scale(0.995);
    }

    #recordButton.recording {
      background: var(--danger);
      transform: scale(0.975);
      box-shadow: 0 0 24px rgba(255, 59, 48, 0.35);
    }

    #recordButton:disabled,
    #saveAllButton:disabled,
    #clearButton:disabled {
      opacity: 0.55;
    }

    .button-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    .action-btn {
      min-height: 58px;
      border: 0;
      border-radius: 18px;
      font-size: 18px;
      font-weight: 700;
      touch-action: manipulation;
    }

    #saveAllButton {
      background: var(--accent);
      color: #00111f;
    }

    #clearButton {
      background: #2a2a2a;
      color: var(--text);
    }

    .meta {
      font-size: 13px;
      color: var(--muted);
      margin: 8px 0 0;
    }

    .preview {
      min-height: 180px;
      background: var(--panel);
      border-radius: var(--radius);
      padding: 14px;
      white-space: pre-wrap;
      word-break: break-word;
      text-align: left;
      line-height: 1.5;
      font-size: 15px;
    }

    .hint {
      margin-top: 10px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>🎤 Voice Recorder</h1>
    <p id="status" class="status">準備完了</p>

    <section class="card">
      <button id="recordButton" type="button">長押しで録音</button>
      <div class="button-row">
        <button id="saveAllButton" class="action-btn" type="button">まとめて保存</button>
        <button id="clearButton" class="action-btn" type="button">クリア</button>
      </div>
      <p id="meta" class="meta">保存待ち 0件</p>
      <p class="hint">短すぎる長押しは無視します。録音後はまとめて保存を押してください。</p>
    </section>

    <pre id="preview" class="preview"></pre>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const WORKER_URL = "https://dreamgroove1.fuwafuwow.workers.dev/";
      const API_KEY = "mysecret123";

      const HOLD_THRESHOLD_MS = 180;
      const END_SETTLE_MS = 450;
      const SAVE_TIMEOUT_MS = 7000;

      let recognition = null;
      let isArming = false;
      let isPressing = false;
      let isRecording = false;
      let isSaving = false;

      let armTimer = null;
      let pressStartedAt = 0;

      let finalBuffer = "";
      let draftBuffer = "";
      let notes = [];

      const statusEl = document.getElementById("status");
      const metaEl = document.getElementById("meta");
      const previewEl = document.getElementById("preview");
      const recordButton = document.getElementById("recordButton");
      const saveAllButton = document.getElementById("saveAllButton");
      const clearButton = document.getElementById("clearButton");

      const SpeechRecognitionClass =
        window.SpeechRecognition || window.webkitSpeechRecognition;

      if (!SpeechRecognitionClass) {
        setStatus("❌ このブラウザは音声認識に非対応です");
        recordButton.disabled = true;
        saveAllButton.disabled = true;
        clearButton.disabled = true;
        return;
      }

      recognition = new SpeechRecognitionClass();
      recognition.lang = "ja-JP";
      recognition.continuous = false;
      recognition.interimResults = true;
      recognition.maxAlternatives = 1;

      recognition.onresult = (event) => {
        let newDraft = "";

        for (let i = event.resultIndex; i < event.results.length; i++) {
          const transcript = event.results[i][0].transcript || "";
          if (event.results[i].isFinal) {
            finalBuffer += transcript + "\n";
          } else {
            newDraft += transcript;
          }
        }

        draftBuffer = newDraft;
        renderPreview();
      };

      recognition.onerror = (event) => {
        if (event.error === "no-speech") {
          setStatus("⚠️ 音声が小さいか無音でした");
          return;
        }
        if (event.error === "aborted") {
          return;
        }
        console.error("speech error:", event.error);
        setStatus("❌ 音声認識エラー: " + event.error);
      };

      recognition.onend = async () => {
        isRecording = false;
        recordButton.classList.remove("recording");

        if (isPressing) {
          startRecognitionSafely();
          return;
        }

        setStatus("⏳ 処理中...");
        await sleep(END_SETTLE_MS);

        const text = pickBestTranscript();
        finalBuffer = "";
        draftBuffer = "";

        if (!text.trim()) {
          renderPreview();
          setStatus("⚠️ 音声が取得できませんでした");
          return;
        }

        notes.push(buildMarkdown(text));
        renderPreview();
        updateMeta();
        setStatus(`📝 ${notes.length}件たまりました`);
      };

      function setStatus(text) {
        statusEl.textContent = text;
      }

      function updateMeta() {
        metaEl.textContent = `保存待ち ${notes.length}件`;
      }

      function sleep(ms) {
        return new Promise((resolve) => setTimeout(resolve, ms));
      }

      function pickBestTranscript() {
        const finalText = normalizeText(finalBuffer);
        const draftText = normalizeText(draftBuffer);
        return finalText || draftText || "";
      }

      function normalizeText(text) {
        return String(text || "")
          .replace(/\u3000/g, " ")
          .replace(/[ \t]+\n/g, "\n")
          .replace(/\n{3,}/g, "\n\n")
          .trim();
      }

      function buildMarkdown(text) {
        const cleaned = normalizeText(text);
        const summary = cleaned.slice(0, 80);

        return `# Voice Note

## Summary
${summary}

## Content
${cleaned}

---
time: ${new Date().toISOString()}
tag: voice
source: browser
`;
      }

      function renderPreview() {
        const pendingVoice = pickBestTranscript();
        let text = "";

        if (notes.length > 0) {
          text += notes.join("\n\n---\n\n");
        }

        if (pendingVoice) {
          if (text) text += "\n\n---\n\n";
          text += `【録音中プレビュー】\n${pendingVoice}`;
        }

        previewEl.textContent = text || "";
      }

      function startRecognitionSafely() {
        if (isRecording) return;

        try {
          recognition.start();
          isRecording = true;
          recordButton.classList.add("recording");
          setStatus("🎤 録音中...");
        } catch (e) {
          console.error("start error:", e);
        }
      }

      function beginArm() {
        if (isSaving || isPressing || isArming) return;

        isArming = true;
        isPressing = true;
        pressStartedAt = Date.now();
        finalBuffer = "";
        draftBuffer = "";
        recordButton.classList.add("arming");
        setStatus("…録音準備中");

        clearTimeout(armTimer);
        armTimer = setTimeout(() => {
          if (!isPressing) return;
          recordButton.classList.remove("arming");
          startRecognitionSafely();
        }, HOLD_THRESHOLD_MS);
      }

      function endPress() {
        if (!isPressing && !isArming && !isRecording) return;

        const heldMs = Date.now() - pressStartedAt;
        clearTimeout(armTimer);

        isArming = false;
        isPressing = false;
        recordButton.classList.remove("arming");

        if (!isRecording) {
          if (heldMs < HOLD_THRESHOLD_MS) {
            setStatus("⚠️ もう少し長く押してください");
          }
          return;
        }

        setStatus("⏹ 録音終了");
        try {
          recognition.stop();
        } catch (e) {
          console.error("stop error:", e);
        }
      }

      async function safeFetch(content) {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), SAVE_TIMEOUT_MS);

        try {
          const res = await fetch(WORKER_URL, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "x-api-key": API_KEY
            },
            body: JSON.stringify({
              content,
              tag: "voice",
              timestamp: new Date().toISOString()
            }),
            signal: controller.signal
          });

          clearTimeout(timeoutId);

          const raw = await res.text();
          let data = null;
          try {
            data = raw ? JSON.parse(raw) : null;
          } catch {
            data = null;
          }

          if (!res.ok) {
            throw new Error(data?.error || raw || `HTTP ${res.status}`);
          }

          return data;
        } catch (firstError) {
          clearTimeout(timeoutId);

          await sleep(500);

          const retryRes = await fetch(WORKER_URL, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "x-api-key": API_KEY
            },
            body: JSON.stringify({
              content,
              tag: "voice",
              timestamp: new Date().toISOString()
            })
          });

          const retryRaw = await retryRes.text();
          let retryData = null;
          try {
            retryData = retryRaw ? JSON.parse(retryRaw) : null;
          } catch {
            retryData = null;
          }

          if (!retryRes.ok) {
            throw new Error(retryData?.error || retryRaw || `HTTP ${retryRes.status}`);
          }

          return retryData;
        }
      }

      async function saveAll() {
        if (isSaving) return;

        if (notes.length === 0) {
          setStatus("⚠️ 保存する内容がありません");
          return;
        }

        isSaving = true;
        toggleButtons(true);
        setStatus("☁ 保存中...");

        const payload = notes.join("\n\n---\n\n");

        try {
          const result = await safeFetch(payload);
          notes = [];
          renderPreview();
          updateMeta();
          setStatus("☁ 保存完了" + (result?.file ? `: ${result.file}` : ""));
        } catch (e) {
          console.error("save error:", e);
          setStatus("❌ 保存失敗: " + (e?.message || "unknown error"));
        } finally {
          isSaving = false;
          toggleButtons(false);
        }
      }

      function clearAll() {
        if (isSaving) return;
        notes = [];
        finalBuffer = "";
        draftBuffer = "";
        renderPreview();
        updateMeta();
        setStatus("🧹 クリアしました");
      }

      function toggleButtons(disabled) {
        recordButton.disabled = disabled;
        saveAllButton.disabled = disabled;
        clearButton.disabled = disabled;
      }

      recordButton.addEventListener("touchstart", (e) => {
        e.preventDefault();
        beginArm();
      }, { passive: false });

      recordButton.addEventListener("touchend", (e) => {
        e.preventDefault();
        endPress();
      }, { passive: false });

      recordButton.addEventListener("touchcancel", (e) => {
        e.preventDefault();
        endPress();
      }, { passive: false });

      window.addEventListener("touchend", () => {
        endPress();
      }, { passive: true });

      saveAllButton.addEventListener("click", saveAll);
      clearButton.addEventListener("click", clearAll);

      updateMeta();
      renderPreview();
    });
  </script>
</body>
</html>
