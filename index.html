<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DreamGroove Voice Recorder</title>

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
      background: #0d0d0d;
      color: white;
    }

    #status {
      margin-bottom: 20px;
      font-size: 16px;
      opacity: 0.8;
    }

    /* 🔥 iPhone最適化ボタン */
    #recordButton {
      width: 95vw;
      max-width: 400px;
      height: 140px;
      font-size: 24px;
      border-radius: 30px;
      border: none;
      background: #222;
      color: white;
      margin-bottom: 20px;
      transition: all 0.15s ease;
    }

    /* 押してる間 */
    #recordButton.recording {
      background: red;
      transform: scale(0.95);
      box-shadow: 0 0 25px red;
    }

    .preview {
      text-align: left;
      background: #111;
      padding: 15px;
      border-radius: 10px;
      white-space: pre-wrap;
      min-height: 120px;
    }
  </style>
</head>

<body>

<h1>🎤 Voice Markdown Recorder</h1>
<p id="status">準備完了</p>

<button id="recordButton">押して話す</button>

<pre id="preview" class="preview"></pre>

<script>
document.addEventListener("DOMContentLoaded", () => {

let recognition;
let isPressing = false;
let buffer = "";

const btn = document.getElementById("recordButton");
const preview = document.getElementById("preview");
const status = document.getElementById("status");

// ======================
// 音声認識
// ======================
if (!('webkitSpeechRecognition' in window)) {
  status.textContent = "❌ このブラウザは非対応";
  return;
}

recognition = new webkitSpeechRecognition();
recognition.lang = "ja-JP";
recognition.continuous = false;
recognition.interimResults = false;

// 音声取得
recognition.onresult = (event) => {
  if (!isPressing) return;

  const text = event.results[0][0].transcript;
  buffer += text + "\n";
  preview.textContent = buffer;
};

// 🔥 iPhone安定化（超重要）
recognition.onend = () => {
  if (isPressing) {
    try {
      recognition.start();
    } catch(e) {}
  }
};

// ======================
// 録音開始（長押し）
// ======================
btn.addEventListener("touchstart", (e) => {
  e.preventDefault();

  if (isPressing) return;

  isPressing = true;
  buffer = "";
  status.textContent = "🎤 録音中...";
  btn.classList.add("recording");

  try {
    recognition.start();
  } catch(e) {}

}, { passive: false });

// ======================
// 録音終了 → 保存
// ======================
btn.addEventListener("touchend", async (e) => {
  e.preventDefault();

  if (!isPressing) return;

  isPressing = false;
  recognition.stop();
  btn.classList.remove("recording");

  status.textContent = "⏳ 保存中...";

  if (!buffer.trim()) {
    status.textContent = "⚠️ 空です";
    return;
  }

  const timestamp = new Date().toISOString();

  try {
    const res = await fetch("https://dreamgroove1.fuwafuwow.workers.dev/", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-api-key": "mysecret123"
      },
      body: JSON.stringify({
        content: buffer,
        tag: "voice",
        timestamp
      })
    });

    const data = await res.json();

    status.textContent = "☁ 保存完了";

  } catch (e) {
    console.error(e);
    status.textContent = "❌ 保存失敗";
  }

}, { passive: false });

});
</script>

</body>
</html>
