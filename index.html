<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Voice Markdown Recorder</title>

<style>
body {
  font-family: sans-serif;
  text-align: center;
  background: black;
  color: white;
}

#recordButton {
  width: 95vw;
  height: 140px;
  font-size: 24px;
  border-radius: 30px;
  background: #222;
  color: white;
  border: none;
}

#recordButton.recording {
  background: red;
  transform: scale(0.95);
}

.preview {
  background: #111;
  padding: 15px;
  margin-top: 20px;
  min-height: 120px;
}
</style>
</head>

<body>

<h1>🎤 Voice Markdown Recorder</h1>
<p id="status">準備完了</p>

<button id="recordButton">押して話す</button>

<pre id="preview" class="preview"></pre>

<script>
document.addEventListener("DOMContentLoaded", () => {

let recognition;
let isPressing = false;
let buffer = "";

const btn = document.getElementById("recordButton");
const preview = document.getElementById("preview");
const status = document.getElementById("status");

if (!('webkitSpeechRecognition' in window)) {
  status.textContent = "非対応ブラウザ";
  return;
}

recognition = new webkitSpeechRecognition();
recognition.lang = "ja-JP";
recognition.continuous = false;
recognition.interimResults = true;

// ★ 修正①
recognition.onresult = (event) => {
  for (let i = event.resultIndex; i < event.results.length; i++) {
    if (event.results[i].isFinal) {
      buffer += event.results[i][0].transcript + "\n";
    }
  }
  preview.textContent = buffer;
};

// ★ 修正②
recognition.onend = () => {
  if (isPressing) recognition.start();
};

// 録音開始
btn.addEventListener("touchstart", (e) => {
  e.preventDefault();
  isPressing = true;
  buffer = "";
  btn.classList.add("recording");
  status.textContent = "録音中";
  recognition.start();
}, { passive: false });

// 録音終了
btn.addEventListener("touchend", async (e) => {
  e.preventDefault();

  isPressing = false;
  recognition.stop();
  btn.classList.remove("recording");

  // ★ 修正③（ここ重要）
  await new Promise(r => setTimeout(r, 300));

  if (!buffer.trim()) {
    status.textContent = "空です";
    return;
  }

  const timestamp = new Date().toISOString();

  try {
    const res = await fetch("https://dreamgroove1.fuwafuwow.workers.dev/", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-api-key": "mysecret123"
      },
      body: JSON.stringify({
        content: buffer,
        tag: "voice",
        timestamp
      })
    });

    const data = await res.json();
    status.textContent = "保存完了";

  } catch (e) {
    status.textContent = "保存失敗";
    console.error(e);
  }

}, { passive: false });

});
</script>

</body>
</html>
